name: lingua
version: 1.1.0
manifest_version: 2
api_version: 1
description: A language learning trainer for Hermes Agent. Build vocabulary decks, get quizzed in chat, and let SM-2 spaced repetition bring each word back right before you forget it. Local first; optional Otari tutor layer adds LLM examples, mnemonics and semantic answer checks when OTARI_API_KEY is set.
author: Oluwatoba Daniel
license: MIT
homepage: https://github.com/tobadaniel/lingua
tags: [language-learning, vocabulary, spaced-repetition, education]
provides_tools:
  - lingua_add
  - lingua_due
  - lingua_grade
  - lingua_list
  - lingua_remove
  - lingua_stats
  - lingua_example
  - lingua_mnemonic
  - lingua_check
provides_hooks:
  - pre_llm_call
config_schema:
  daily_target: {type: int, default: 10, description: "How many due cards a review session aims for"}
  nudge_on_first_turn: {type: bool, default: true, description: "Mention due reviews at the start of a new session"}
  otari_enabled: {type: bool, default: true, description: "Enable the optional Otari tutor layer (example sentences, mnemonics, semantic answer checks). It only makes network calls when OTARI_API_KEY is set in the environment."}
  otari_model: {type: string, default: "", description: "Otari model id in provider/model form, e.g. openai/gpt-oss-20b. Empty means use OTARI_MODEL or the built-in default."}
  otari_base_url: {type: string, default: "", description: "Otari gateway base URL. Empty means use OTARI_BASE_URL or https://api.otari.ai/api/v1 (EU keys: https://eu.api.otari.ai/api/v1)."}
